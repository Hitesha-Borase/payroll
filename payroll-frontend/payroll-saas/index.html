<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/kiaan_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kiaan Payroll" />
    <meta name="description" content="Kiaan Technology - Workforce & Payroll Management SaaS PWA" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/kiaan_logo.png" />
    <title>Kiaan Technology | Payroll & HRMS SaaS</title>
    
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- 1. HIDE GOOGLE BRANDING & POPUPS -->
    <style>
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-te-gadget-icon,
      .goog-logo-link,
      .goog-te-spinner-pos,
      .goog-te-spinner,
      .goog-te-spinner *,
      .goog-te-gadget img,
      .goog-te-menu-value img,
      iframe.skiptranslate {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      body { top: 0px !important; }
      .goog-te-gadget { color: transparent !important; font-size: 0 !important; }
      .goog-te-gadget span { display: none !important; }
    </style>

    <!-- 2. INITIALIZE GOOGLE TRANSLATE LOGIC -->
    <script type="text/javascript">
      window.googleTranslateElementInit = function () {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,ar,fr,es,de,ja,zh-CN,ru,pt,it',
            autoDisplay: false
          }, 'google_translate_master_container');
        }
      };
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- 3. INVISIBLE GOOGLE CONTAINER -->
    <div id="google_translate_master_container" style="display:none !important"></div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Bootstrap JS (bundle includes Popper) -->
<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
crossorigin="anonymous"
></script>
  </body>
</html>
